name: Publish to npm

on:
  push:
    branches: [main]

# Publishes every workspace package whose version is not on npm yet, in
# dependency order (core first). Uses the NPM_TOKEN secret when present and
# falls back to npm trusted publishing (OIDC via id-token: write) otherwise.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use the latest npm
        run: npm install -g npm@latest && node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck and test
        run: |
          npm run build
          npm run typecheck
          npm test
          bash scripts/check-packed.sh

      - name: Publish packages that are not on npm yet
        run: |
          set -e
          for dir in packages/core packages/sqlserver packages/postgres packages/mysql packages/oracle packages/sqlite; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi
            echo "::group::Publishing $name@$version"
            (cd "$dir" && npm publish --access public --provenance)
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
