name: Publish to npm

on:
  push:
    branches: [main]

# Publishes every workspace package whose version is not on npm yet, in
# dependency order (core first). Uses the NPM_TOKEN secret when present and
# falls back to npm trusted publishing (OIDC via id-token: write) otherwise.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Use the latest npm
        run: npm install -g npm@latest && node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build, typecheck and test
        run: |
          npm run build
          npm run typecheck
          npm test
          bash scripts/check-packed.sh

      - name: Publish packages that are not on npm yet
        # `npm view` reads from eventually-consistent replicas, so a merge that
        # lands minutes after a release can still see 404 for a version that is
        # already published. The publish itself is authoritative: a 409
        # "previously staged version" means it is there, and is not a failure.
        run: |
          set -eo pipefail
          for dir in packages/core packages/sqlserver packages/postgres packages/mysql packages/oracle packages/sqlite; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi
            echo "::group::Publishing $name@$version"
            if (cd "$dir" && npm publish --access public --provenance 2>&1 | tee publish.log); then
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            if grep -qE "E409|previously staged version|cannot publish over" "$dir/publish.log"; then
              echo "$name@$version already exists on the registry (409 after replica lag); treating as published."
              continue
            fi
            echo "::error::Publishing $name@$version failed."
            exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
