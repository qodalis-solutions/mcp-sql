name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', 'latest']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use the latest npm
        run: npm install -g npm@latest && node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run check-format

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Postgres integration tests
        run: npx vitest run --project postgres-integration
        env:
          RUN_INTEGRATION: '1'
          POSTGRES_HOST: localhost
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DATABASE: mcp
          POSTGRES_SSL: 'false'

      - name: Smoke-test the CLIs
        run: |
          node packages/sqlserver/dist/src/cli.js --version
          node packages/postgres/dist/src/cli.js --version
